- title: Work Experience
  type: time_table
  contents:
    - title: Research Associate
      institution: JNCASR, Bengaluru
      year: 2017 - 2025
      description:
        - Combined electronic-structure modeling with <a href="https://sscha.eu/">SSCHA</a> to study how stereochemically active lone pairs and symmetry-breaking distortions modulate anharmonic phonon behavior and thermal transport in thermoelectrics.
        - Analyzed the role of ionic motion in shaping anharmonic and thermodynamic properties of disordered crystals, leveraging ML-trained force fields, large-scale MD, and <a href="https://tdep-developers.github.io/tdep/">TDEP</a> phonon renormalization techniques.
        
    - title: Research Consultant
      institution: Indian Institute of Technology Kharagpur, WB, India
      year: 2015-2017
      description:
        - Conducted research on nanoscale friction in carbon nanotubes and layered 2D materials, providing atomistic insight into frictional dissipation mechanisms relevant for nano-devices and tribological applications..
        - Collaborated with the <a href="https://www.vssc.gov.in/">Vikram Sarabhai Space Centre (VSSC)</a> on multiscale modelling of CNT-reinforced epoxy nanocomposites, integrating atomistic and continuum-level simulations to evaluate material behaviour.

    - title: Jr. Engineer
      institution:  <a href="https://www.synergies-castings.com/home.html">SYNERGIES CASTINGS Ltd</a>, Visakhapatnam
      year: 2006-2007
      description:
        - Received extensive early-career exposure to full-cycle mechanical processing, from casting through precision machining and coating, which provided a highly valuable introduction to manufacturing environments and hands-on engineering experience.

