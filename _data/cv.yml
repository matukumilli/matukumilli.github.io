- title: Research Areas
  type: list
  contents:
     - Exploring thermal transport in complex crystals using first-principles DFT, anharmonic phonon theory, finite-T lattice dynamics, and ML-based MD, covering vibrational regimes from overdamped motion to quantum fluctuations. Applications include thermoelectrics, superionicity, phason dynamics, and quantum-geometry–driven nonlinear transport.
#    - 'Computational materials science with a focus on thermal transport in complex crystals, including anharmonic #phonon–phonon interactions, finite-temperature lattice dynamics, and frictional phenomena. 
#Skilled in molecular dynamics (MD) and first-principles density functional theory (DFT), leveraging machine-learning #force fields for near-quantum accuracy. 
#Investigating diverse atomic vibration regimes, from overdamped motion to quantum fluctuations, and extending machine-#learning frameworks to capture charge response, electronic structure, and spin properties. 
#Applications include superionic transport, thermoelectrics, nonlinear transport phenomena, phason dynamics, and #quantum geometric effects.' 

