- title: Research Areas
  type: list
  contents:
    - '\item Computational materials science with a focus on thermal transport in complex crystals, including anharmonic phonon–phonon interactions, finite-temperature lattice dynamics, and frictional phenomena.
\item Skilled in molecular dynamics (MD) and first-principles density functional theory (DFT), leveraging machine-learning force fields for near-quantum accuracy.
\item Investigating diverse atomic vibration regimes, from overdamped motion to quantum fluctuations, and extending machine-learning frameworks to capture charge response, electronic structure, and spin properties.
\item Applications include superionic transport, thermoelectrics, nonlinear transport phenomena, phason dynamics, and quantum geometric effects.' 

